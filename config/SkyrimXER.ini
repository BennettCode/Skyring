; SkyrimXER settings (copied next to SkyrimXER.dll by tools/deploy.ps1). Read when the game loads.
[Combat]
; Multiplies the damage Elden Ring's swings do to Skyrim enemies. 1.0 = about as many hits as a comparable Elden Ring enemy takes.
fDamageScale=1.0

[Weapons]
; Elden Ring weapon (EquipParamWeapon id, +0) swung for each Skyrim weapon kind. The upgrade level comes from the Skyrim weapon's
; material (iron +0 ... dragonbone ~+25). 0 = Elden Ring keeps its own weapon for that kind.
Dagger=1000000
Sword=2000000
WarAxe=14000000
Mace=11000000
Greatsword=3000000
Battleaxe=15000000
Warhammer=12000000
Bow=41000000
Crossbow=43000000
; Elden Ring ammo the bow/crossbow uses (any arrows/bolts your Elden Ring character owns are used if it has none of these).
Arrow=50000000
Bolt=52000000
