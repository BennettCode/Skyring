# ---- region layout ------------------------------------------------------------------------------------------------

[[structs]]
name = "Header"
size = 64
doc = "At OFF_HEADER. Each side writes only its own sky_* / er_* fields; the creator writes the rest, magic last."
fields = [
  { name = "magic", type = "u32", doc = "MAGIC once the creator finished initialising; 0 before." },
  { name = "version", type = "u32", doc = "VERSION of the creator." },
  { name = "header_size", type = "u32", doc = "size of Header." },
  { name = "region_size", type = "u32", doc = "REGION_SIZE of the creator." },
  { name = "sky_pid", type = "u32" },
  { name = "er_pid", type = "u32" },
  { name = "sky_state", type = "u32", doc = "SideState" },
  { name = "er_state", type = "u32", doc = "SideState" },
  { name = "sky_heartbeat_ms", type = "u64", doc = "GetTickCount64() at Skyrim's last link tick." },
  { name = "er_heartbeat_ms", type = "u64", doc = "GetTickCount64() at ER's last link tick." },
  { name = "sky_attach_count", type = "u32", doc = "Bumped each time Skyrim (re)attaches, so the peer notices a restart." },
  { name = "er_attach_count", type = "u32" },
  { name = "_reserved", type = "u64" },
]

[[structs]]
name = "RingHeader"
size = 64
doc = "One-way ring: exactly one writer and one reader. Positions are total bytes ever written/read (never wrap)."
fields = [
  { name = "write_pos", type = "u64", doc = "Writer only. Published with release after the bytes are copied." },
  { name = "read_pos", type = "u64", doc = "Reader only. Published with release after the bytes are consumed." },
  { name = "capacity", type = "u32", doc = "RING_CAPACITY (written by the region creator)." },
  { name = "dropped", type = "u32", doc = "Writer only: messages dropped because the ring was full." },
  { name = "_reserved", type = "u64[5]" },
]

[[structs]]
name = "MsgHeader"
size = 8
doc = "Precedes every payload in a ring. The whole message is padded to MSG_ALIGN."
fields = [
  { name = "msg_type", type = "u16", doc = "MsgType" },
  { name = "size", type = "u16", doc = "Payload bytes (without this header or padding)." },
  { name = "seq", type = "u32", doc = "Per-ring counter, starts at 1 each time the writer attaches." },
]

# Seqlock slots (blocks named SLOT_*): one writer, any number of readers, latest value only.
# The struct must start with `seq: u32` (odd = being written) and its size must be a multiple of 4: the body is copied as u32 words.
# Writer: seq+1, release fence, copy words, seq+2 (release). Reader: seq (acquire), retry while odd, copy, acquire fence,
# accept if seq is unchanged (at most SLOT_READ_TRIES tries). Data older than SLOT_STALE_MS, or with the link not connected, is stale.

[[structs]]
name = "InputState"
size = 56
doc = "At OFF_SLOT_INPUT. Written by Skyrim's game thread every frame, read by ER's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "_pad0", type = "u32" },
  { name = "frame", type = "u64", doc = "Skyrim frame counter." },
  { name = "time_ms", type = "u64", doc = "GetTickCount64() when written." },
  { name = "buttons", type = "u32", doc = "Held Button bits." },
  { name = "flags", type = "u32", doc = "InputFlag bits." },
  { name = "move_x", type = "f32", doc = "Move stick right, -1..1." },
  { name = "move_y", type = "f32", doc = "Move stick forward, -1..1." },
  { name = "cam_yaw", type = "f32", doc = "With Locomote: where Skyrim looks, as a yaw in ER's world (Skyrim camera yaw minus the mode's world offset W), radians. ER turns the stick by cam_yaw minus its own camera yaw." },
  { name = "stance", type = "u32", doc = "Stance (Unarmed / OneHanded / TwoHanded)." },
  { name = "er_weapon", type = "i32", doc = "v10: ER weapon param id (with upgrade level) for the Skyrim weapon in the right hand (bridge/WeaponMap); 0 = ER keeps its own. ER writes it into the right-hand slot it uses." },
  { name = "_pad1", type = "u32" },
]

[[structs]]
name = "PlayerState"
size = 128
doc = "At OFF_SLOT_PLAYER. Written by ER's game thread every frame, read by Skyrim's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "flags", type = "u32", doc = "PlayerFlag bits." },
  { name = "frame", type = "u64", doc = "ER frame counter." },
  { name = "time_ms", type = "u64", doc = "GetTickCount64() when written." },
  { name = "hp", type = "i32" },
  { name = "max_hp", type = "i32" },
  { name = "fp", type = "i32" },
  { name = "max_fp", type = "i32" },
  { name = "stamina", type = "i32" },
  { name = "max_stamina", type = "i32" },
  { name = "anim_id", type = "i32", doc = "Current ER animation id (e.g. 27010 = backstep)." },
  { name = "block_id", type = "i32", doc = "ER map block id (eldenring-rs BlockId as i32, e.g. m10_01_00_00)." },
  { name = "poise", type = "f32" },
  { name = "poise_max", type = "f32" },
  { name = "pos", type = "f32[3]", doc = "ER world position (Y-up, metres)." },
  { name = "yaw", type = "f32", doc = "ER yaw, radians." },
  { name = "time_us", type = "u64", doc = "QueryPerformanceCounter time when written, microseconds (one clock for both processes): interpolation." },
  { name = "cam_yaw", type = "f32", doc = "ER camera yaw, radians (same convention as yaw); the stick is relative to it. Diagnostics." },
  { name = "attack_seq", type = "u32", doc = "v9: +1 each time a hit window opens (PlayerFlag AttackActive rising edge)." },
  { name = "atk_phys", type = "f32", doc = "v9: ER physical damage of the current/last swing before defense: weapon attack rating x motion value." },
  { name = "atk_mag", type = "f32", doc = "v9: magic, same." },
  { name = "atk_fire", type = "f32", doc = "v9: fire, same." },
  { name = "atk_thun", type = "f32", doc = "v9: lightning, same." },
  { name = "atk_holy", type = "f32", doc = "v9: holy, same." },
  { name = "atk_poise", type = "f32", doc = "v9: poise damage of the swing." },
  { name = "atk_kind", type = "u32", doc = "v9: AttackKind." },
  { name = "_pad1", type = "u32" },
]

[[structs]]
name = "PoseState"
size = 440
doc = "At OFF_SLOT_POSE. Written by ER's game thread every frame, read by Skyrim's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "flags", type = "u32", doc = "PoseFlag bits." },
  { name = "frame", type = "u64", doc = "ER frame counter." },
  { name = "time_ms", type = "u64", doc = "GetTickCount64() when written." },
  { name = "time_us", type = "u64", doc = "QueryPerformanceCounter time when written, microseconds (one clock for both processes): interpolation." },
  { name = "bone_count", type = "u32", doc = "POSE_BONE_COUNT of the writer." },
  { name = "yaw", type = "f32", doc = "ER body yaw, radians (same convention as PlayerState.yaw)." },
  { name = "pelvis_offset", type = "f32[3]", doc = "Pelvis offset from its bind position, Skyrim model basis (x right, y forward, z up), metres." },
  { name = "_pad0", type = "u32" },
  { name = "rot", type = "f32[96]", doc = "Per PoseBone: model-space delta from bind (q_model * q_bind_model^-1), Skyrim model basis, x y z w." },
]

[[structs]]
name = "PoseBind"
size = 304
doc = "At OFF_SLOT_POSE_BIND. Written by ER once per skeleton (when it resolves), read by Skyrim to fit its bind pose to ER's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "bone_count", type = "u32", doc = "POSE_BONE_COUNT of the writer." },
  { name = "frame", type = "u64", doc = "ER frame when the skeleton resolved (changes = a new skeleton: refit)." },
  { name = "dir", type = "f32[72]", doc = "Per PoseBone: unit bind segment direction (bone to its child), Skyrim model basis; (0,0,0) = none (use the parent's fit)." },
]

[region]
blocks = [
  { name = "HEADER", offset = 0x0, struct = "Header" },
  { name = "RING_SKY_TO_ER", offset = 0x100, struct = "RingHeader" },
  { name = "RING_ER_TO_SKY", offset = 0x140, struct = "RingHeader" },
  { name = "SLOT_INPUT", offset = 0x200, struct = "InputState" },
  { name = "SLOT_PLAYER", offset = 0x300, struct = "PlayerState" },
  { name = "SLOT_POSE", offset = 0x400, struct = "PoseState" },
  { name = "SLOT_POSE_BIND", offset = 0x800, struct = "PoseBind" },
  { name = "RING_SKY_TO_ER_DATA", offset = 0x1000, bytes = 0x10000 },
  { name = "RING_ER_TO_SKY_DATA", offset = 0x11000, bytes = 0x10000 },
]

# ---- event payloads (MsgType = struct name) -----------------------------------------------------------------------

[[messages]]
name = "Hello"
size = 24
doc = "Sent on attach and whenever a new peer appears. The receiver checks protocol_version."
fields = [
  { name = "protocol_version", type = "u32" },
  { name = "pid", type = "u32" },
  { name = "plugin_version", type = "u16[3]", doc = "major, minor, patch" },
  { name = "_pad0", type = "u16" },
  { name = "game_version", type = "u16[4]", doc = "Host exe version, e.g. 1.7.104.0 / 2.7.1.0" },
]

[[messages]]
name = "Bye"
size = 8
doc = "Best effort on clean exit. A crash sends nothing; the heartbeat timeout covers that."
fields = [
  { name = "reason", type = "u32", doc = "ByeReason" },
  { name = "_pad0", type = "u32" },
]

[[messages]]
name = "Heartbeat"
size = 16
doc = "Every HEARTBEAT_EVENT_INTERVAL_MS while connected. Proves the ring works (the header heartbeat proves liveness)."
fields = [
  { name = "uptime_ms", type = "u64", doc = "Since this side attached." },
  { name = "frames", type = "u64", doc = "Game frames this side has run (0 = no frame hook yet)." },
]
