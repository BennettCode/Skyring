# Skyrim X Elden Ring shared-memory protocol: the SINGLE SOURCE OF TRUTH.
#
# `cargo run -p protogen` turns this into protocol/generated/skyrimxer_protocol.{h,rs}. Never hand-edit those files.
# Bump `version` (and the region name suffix) for ANY layout change, then rebuild both plugins.
#
# Rules the generator enforces:
# - Field types: u8 u16 u32 u64 i8 i16 i32 i64 f32 f64, or a fixed array like "u16[3]".
# - Every field sits at its natural alignment with NO implicit padding: add explicit `_pad*` fields.
# - A struct's size must be a multiple of its alignment, and must equal `size` when given.
# - Region blocks must not overlap, and each block must fit its struct.
# Enums are listed for both languages, but struct fields store them as plain integers: an out-of-range value
# read from shared memory must never be undefined behaviour on the Rust side.
# All values are little-endian (both games are x64 Windows).

[protocol]
version = 4
magic = "SXER"                      # stored as a little-endian u32: bytes 'S' 'X' 'E' 'R'
region_name = 'Local\SkyrimXER_v4'  # must end in _v<version>

[constants]
HEARTBEAT_TIMEOUT_MS = { type = "u64", value = 2000, doc = "Peer counts as gone when its heartbeat is older than this." }
HEARTBEAT_EVENT_INTERVAL_MS = { type = "u64", value = 5000, doc = "How often each side sends a Heartbeat event (logged by the peer)." }
LINK_TICK_MS = { type = "u64", value = 50, doc = "Link thread period on both sides (header heartbeat is refreshed every tick)." }
RING_CAPACITY = { type = "u32", value = 0x10000, doc = "Data bytes per ring. Power of two." }
MSG_ALIGN = { type = "u32", value = 8, doc = "Each message (header + payload) is padded to this many bytes." }
MSG_MAX_PAYLOAD = { type = "u32", value = 1024, doc = "Largest payload a message may carry." }
SLOT_STALE_MS = { type = "u64", value = 250, doc = "Slot data whose time_ms is older than this is stale (the reader ignores it)." }
SLOT_READ_TRIES = { type = "u32", value = 64, doc = "A slot reader gives up after this many torn reads in a row." }
POSE_BONE_COUNT = { type = "u32", value = 20, doc = "PoseBone values; PoseState.rot holds 4 floats per bone." }

[[enums]]
name = "SideState"
repr = "u32"
doc = "Header sky_state / er_state."
values = [
  { name = "Absent", value = 0, doc = "Never attached (or the region was just created)." },
  { name = "Starting", value = 1, doc = "Attached, initialising." },
  { name = "Ready", value = 2, doc = "Attached, waiting for the peer." },
  { name = "Running", value = 3, doc = "Handshake done with a live peer." },
  { name = "ShuttingDown", value = 4, doc = "Exiting cleanly (a Bye was sent)." },
  { name = "Faulted", value = 5, doc = "Protocol error (e.g. version mismatch); this side ignores the region." },
]

[[enums]]
name = "ByeReason"
repr = "u32"
values = [
  { name = "Quit", value = 0, doc = "The game is exiting normally." },
  { name = "Faulted", value = 1, doc = "This side hit a protocol error and is giving up." },
]

[[enums]]
name = "MsgType"
repr = "u16"
doc = "MsgHeader.msg_type. Payload structs are listed under [[messages]]."
values = [
  { name = "Hello", value = 1 },
  { name = "Bye", value = 2 },
  { name = "Heartbeat", value = 3 },
]

[[enums]]
name = "Button"
repr = "u32"
doc = "InputState.buttons. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "Dodge", value = 0, doc = "Skyrim's Sprint user event, held state forwarded raw (ER: tap = roll/backstep, hold = dash)." },
]

[[enums]]
name = "InputFlag"
repr = "u32"
doc = "InputState.flags. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "InCombat", value = 0, doc = "The Skyrim player is in combat. ER mirrors it in its own combat state (dodges cost stamina only in combat)." },
  { name = "BridgeOn", value = 1, doc = "The bridge is on (F10). Off = Skyrim plays vanilla; ER leaves its own state alone." },
]

[[enums]]
name = "PlayerFlag"
repr = "u32"
doc = "PlayerState.flags. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "InWorld", value = 0, doc = "The ER player is loaded in the world (not title screen / loading)." },
  { name = "IFrame", value = 1, doc = "Invincible (dodge i-frames)." },
  { name = "Dodging", value = 2 },
  { name = "HyperArmor", value = 3 },
  { name = "PoiseBroken", value = 4 },
  { name = "InCombat", value = 5, doc = "ER's own combat state (CSChrDataModule +0x19a bit 0x40 clear): dodges cost stamina." },
  { name = "MoveCancel", value = 6, doc = "ER's TAE movement-cancel window (CANCEL_LS_MOVEMENT): movement may end the current animation." },
]

[[enums]]
name = "PoseFlag"
repr = "u32"
doc = "PoseState.flags. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "Active", value = 0, doc = "ER is playing an action Skyrim should show (dodge first). Off = Skyrim plays its own animation (blend out)." },
]

[[enums]]
name = "PoseBone"
repr = "u32"
doc = "Index into PoseState.rot (4 floats each). Parents come before children. Unlisted Skyrim bones ride on their parents."
values = [
  { name = "Pelvis", value = 0, doc = "NPC Pelvis" },
  { name = "Spine", value = 1, doc = "NPC Spine" },
  { name = "Spine1", value = 2, doc = "NPC Spine1" },
  { name = "Spine2", value = 3, doc = "NPC Spine2" },
  { name = "Neck", value = 4, doc = "NPC Neck" },
  { name = "Head", value = 5, doc = "NPC Head" },
  { name = "LClavicle", value = 6, doc = "NPC L Clavicle" },
  { name = "LUpperArm", value = 7, doc = "NPC L UpperArm" },
  { name = "LForearm", value = 8, doc = "NPC L Forearm" },
  { name = "LHand", value = 9, doc = "NPC L Hand" },
  { name = "RClavicle", value = 10, doc = "NPC R Clavicle" },
  { name = "RUpperArm", value = 11, doc = "NPC R UpperArm" },
  { name = "RForearm", value = 12, doc = "NPC R Forearm" },
  { name = "RHand", value = 13, doc = "NPC R Hand" },
  { name = "LThigh", value = 14, doc = "NPC L Thigh" },
  { name = "LCalf", value = 15, doc = "NPC L Calf" },
  { name = "LFoot", value = 16, doc = "NPC L Foot" },
  { name = "RThigh", value = 17, doc = "NPC R Thigh" },
  { name = "RCalf", value = 18, doc = "NPC R Calf" },
  { name = "RFoot", value = 19, doc = "NPC R Foot" },
]

# ---- region layout ------------------------------------------------------------------------------------------------

[[structs]]
name = "Header"
size = 64
doc = "At OFF_HEADER. Each side writes only its own sky_* / er_* fields; the creator writes the rest, magic last."
fields = [
  { name = "magic", type = "u32", doc = "MAGIC once the creator finished initialising; 0 before." },
  { name = "version", type = "u32", doc = "VERSION of the creator." },
  { name = "header_size", type = "u32", doc = "size of Header." },
  { name = "region_size", type = "u32", doc = "REGION_SIZE of the creator." },
  { name = "sky_pid", type = "u32" },
  { name = "er_pid", type = "u32" },
  { name = "sky_state", type = "u32", doc = "SideState" },
  { name = "er_state", type = "u32", doc = "SideState" },
  { name = "sky_heartbeat_ms", type = "u64", doc = "GetTickCount64() at Skyrim's last link tick." },
  { name = "er_heartbeat_ms", type = "u64", doc = "GetTickCount64() at ER's last link tick." },
  { name = "sky_attach_count", type = "u32", doc = "Bumped each time Skyrim (re)attaches, so the peer notices a restart." },
  { name = "er_attach_count", type = "u32" },
  { name = "_reserved", type = "u64" },
]

[[structs]]
name = "RingHeader"
size = 64
doc = "One-way ring: exactly one writer and one reader. Positions are total bytes ever written/read (never wrap)."
fields = [
  { name = "write_pos", type = "u64", doc = "Writer only. Published with release after the bytes are copied." },
  { name = "read_pos", type = "u64", doc = "Reader only. Published with release after the bytes are consumed." },
  { name = "capacity", type = "u32", doc = "RING_CAPACITY (written by the region creator)." },
  { name = "dropped", type = "u32", doc = "Writer only: messages dropped because the ring was full." },
  { name = "_reserved", type = "u64[5]" },
]

[[structs]]
name = "MsgHeader"
size = 8
doc = "Precedes every payload in a ring. The whole message is padded to MSG_ALIGN."
fields = [
  { name = "msg_type", type = "u16", doc = "MsgType" },
  { name = "size", type = "u16", doc = "Payload bytes (without this header or padding)." },
  { name = "seq", type = "u32", doc = "Per-ring counter, starts at 1 each time the writer attaches." },
]

# Seqlock slots (blocks named SLOT_*): one writer, any number of readers, latest value only.
# The struct must start with `seq: u32` (odd = being written) and its size must be a multiple of 4: the body is copied as u32 words.
# Writer: seq+1, release fence, copy words, seq+2 (release). Reader: seq (acquire), retry while odd, copy, acquire fence,
# accept if seq is unchanged (at most SLOT_READ_TRIES tries). Data older than SLOT_STALE_MS, or with the link not connected, is stale.

[[structs]]
name = "InputState"
size = 48
doc = "At OFF_SLOT_INPUT. Written by Skyrim's game thread every frame, read by ER's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "_pad0", type = "u32" },
  { name = "frame", type = "u64", doc = "Skyrim frame counter." },
  { name = "time_ms", type = "u64", doc = "GetTickCount64() when written." },
  { name = "buttons", type = "u32", doc = "Held Button bits." },
  { name = "flags", type = "u32", doc = "InputFlag bits." },
  { name = "move_x", type = "f32", doc = "Move stick right, -1..1." },
  { name = "move_y", type = "f32", doc = "Move stick forward, -1..1." },
  { name = "cam_yaw", type = "f32", doc = "Skyrim camera yaw, radians." },
  { name = "_pad2", type = "u32" },
]

[[structs]]
name = "PlayerState"
size = 80
doc = "At OFF_SLOT_PLAYER. Written by ER's game thread every frame, read by Skyrim's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "flags", type = "u32", doc = "PlayerFlag bits." },
  { name = "frame", type = "u64", doc = "ER frame counter." },
  { name = "time_ms", type = "u64", doc = "GetTickCount64() when written." },
  { name = "hp", type = "i32" },
  { name = "max_hp", type = "i32" },
  { name = "fp", type = "i32" },
  { name = "max_fp", type = "i32" },
  { name = "stamina", type = "i32" },
  { name = "max_stamina", type = "i32" },
  { name = "anim_id", type = "i32", doc = "Current ER animation id (e.g. 27010 = backstep)." },
  { name = "block_id", type = "i32", doc = "ER map block id (eldenring-rs BlockId as i32, e.g. m10_01_00_00)." },
  { name = "poise", type = "f32" },
  { name = "poise_max", type = "f32" },
  { name = "pos", type = "f32[3]", doc = "ER world position (Y-up, metres)." },
  { name = "yaw", type = "f32", doc = "ER yaw, radians." },
]

[[structs]]
name = "PoseState"
size = 368
doc = "At OFF_SLOT_POSE. Written by ER's game thread every frame, read by Skyrim's."
fields = [
  { name = "seq", type = "u32", doc = "Seqlock counter (odd = being written)." },
  { name = "flags", type = "u32", doc = "PoseFlag bits." },
  { name = "frame", type = "u64", doc = "ER frame counter." },
  { name = "time_ms", type = "u64", doc = "GetTickCount64() when written." },
  { name = "bone_count", type = "u32", doc = "POSE_BONE_COUNT of the writer." },
  { name = "yaw", type = "f32", doc = "ER body yaw, radians (same convention as PlayerState.yaw)." },
  { name = "pelvis_offset", type = "f32[3]", doc = "Pelvis offset from its bind position, Skyrim model basis (x right, y forward, z up), metres." },
  { name = "_pad0", type = "u32" },
  { name = "rot", type = "f32[80]", doc = "Per PoseBone: model-space delta from bind (q_model * q_bind_model^-1), Skyrim model basis, x y z w." },
]

[region]
blocks = [
  { name = "HEADER", offset = 0x0, struct = "Header" },
  { name = "RING_SKY_TO_ER", offset = 0x100, struct = "RingHeader" },
  { name = "RING_ER_TO_SKY", offset = 0x140, struct = "RingHeader" },
  { name = "SLOT_INPUT", offset = 0x200, struct = "InputState" },
  { name = "SLOT_PLAYER", offset = 0x300, struct = "PlayerState" },
  { name = "SLOT_POSE", offset = 0x400, struct = "PoseState" },
  { name = "RING_SKY_TO_ER_DATA", offset = 0x1000, bytes = 0x10000 },
  { name = "RING_ER_TO_SKY_DATA", offset = 0x11000, bytes = 0x10000 },
]

# ---- event payloads (MsgType = struct name) -----------------------------------------------------------------------

[[messages]]
name = "Hello"
size = 24
doc = "Sent on attach and whenever a new peer appears. The receiver checks protocol_version."
fields = [
  { name = "protocol_version", type = "u32" },
  { name = "pid", type = "u32" },
  { name = "plugin_version", type = "u16[3]", doc = "major, minor, patch" },
  { name = "_pad0", type = "u16" },
  { name = "game_version", type = "u16[4]", doc = "Host exe version, e.g. 1.7.104.0 / 2.7.1.0" },
]

[[messages]]
name = "Bye"
size = 8
doc = "Best effort on clean exit. A crash sends nothing; the heartbeat timeout covers that."
fields = [
  { name = "reason", type = "u32", doc = "ByeReason" },
  { name = "_pad0", type = "u32" },
]

[[messages]]
name = "Heartbeat"
size = 16
doc = "Every HEARTBEAT_EVENT_INTERVAL_MS while connected. Proves the ring works (the header heartbeat proves liveness)."
fields = [
  { name = "uptime_ms", type = "u64", doc = "Since this side attached." },
  { name = "frames", type = "u64", doc = "Game frames this side has run (0 = no frame hook yet)." },
]
