# Skyrim X Elden Ring shared-memory protocol: the SINGLE SOURCE OF TRUTH.
#
# `cargo run -p protogen` turns this into protocol/generated/skyrimxer_protocol.{h,rs}. Never hand-edit those files.
# Bump `version` (and the region name suffix) for ANY layout change, then rebuild both plugins.
#
# Rules the generator enforces:
# - Field types: u8 u16 u32 u64 i8 i16 i32 i64 f32 f64, or a fixed array like "u16[3]".
# - Every field sits at its natural alignment with NO implicit padding: add explicit `_pad*` fields.
# - A struct's size must be a multiple of its alignment, and must equal `size` when given.
# - Region blocks must not overlap, and each block must fit its struct.
# Enums are listed for both languages, but struct fields store them as plain integers: an out-of-range value
# read from shared memory must never be undefined behaviour on the Rust side.
# All values are little-endian (both games are x64 Windows).

[protocol]
version = 10
magic = "SXER"                      # stored as a little-endian u32: bytes 'S' 'X' 'E' 'R'
region_name = 'Local\SkyrimXER_v10'  # must end in _v<version>

[constants]
HEARTBEAT_TIMEOUT_MS = { type = "u64", value = 2000, doc = "Peer counts as gone when its heartbeat is older than this." }
HEARTBEAT_EVENT_INTERVAL_MS = { type = "u64", value = 5000, doc = "How often each side sends a Heartbeat event (logged by the peer)." }
LINK_TICK_MS = { type = "u64", value = 50, doc = "Link thread period on both sides (header heartbeat is refreshed every tick)." }
RING_CAPACITY = { type = "u32", value = 0x10000, doc = "Data bytes per ring. Power of two." }
MSG_ALIGN = { type = "u32", value = 8, doc = "Each message (header + payload) is padded to this many bytes." }
MSG_MAX_PAYLOAD = { type = "u32", value = 1024, doc = "Largest payload a message may carry." }
SLOT_STALE_MS = { type = "u64", value = 250, doc = "Slot data whose time_ms is older than this is stale (the reader ignores it)." }
SLOT_READ_TRIES = { type = "u32", value = 64, doc = "A slot reader gives up after this many torn reads in a row." }
POSE_BONE_COUNT = { type = "u32", value = 24, doc = "PoseBone values; PoseState.rot holds 4 floats per bone." }

[[enums]]
name = "SideState"
repr = "u32"
doc = "Header sky_state / er_state."
values = [
  { name = "Absent", value = 0, doc = "Never attached (or the region was just created)." },
  { name = "Starting", value = 1, doc = "Attached, initialising." },
  { name = "Ready", value = 2, doc = "Attached, waiting for the peer." },
  { name = "Running", value = 3, doc = "Handshake done with a live peer." },
  { name = "ShuttingDown", value = 4, doc = "Exiting cleanly (a Bye was sent)." },
  { name = "Faulted", value = 5, doc = "Protocol error (e.g. version mismatch); this side ignores the region." },
]

[[enums]]
name = "ByeReason"
repr = "u32"
values = [
  { name = "Quit", value = 0, doc = "The game is exiting normally." },
  { name = "Faulted", value = 1, doc = "This side hit a protocol error and is giving up." },
]

[[enums]]
name = "MsgType"
repr = "u16"
doc = "MsgHeader.msg_type. Payload structs are listed under [[messages]]."
values = [
  { name = "Hello", value = 1 },
  { name = "Bye", value = 2 },
  { name = "Heartbeat", value = 3 },
]

[[enums]]
name = "Button"
repr = "u32"
doc = "InputState.buttons. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "Dodge", value = 0, doc = "Skyrim's Sprint user event, held state forwarded raw (ER: tap = roll/backstep, hold = dash)." },
  { name = "Attack", value = 1, doc = "v8: ER Attack (pad R1, mouse left), held state raw. ER's own gating decides the move." },
  { name = "StrongAttack", value = 2, doc = "v8: ER StrongAttack (pad R2; hold = charge), held state raw." },
  { name = "Guard", value = 3, doc = "v8: ER Guard (pad L1, mouse right), held state raw." },
  { name = "Skill", value = 4, doc = "v8: ER Skill / weapon art (pad L2), held state raw." },
]

[[enums]]
name = "InputFlag"
repr = "u32"
doc = "InputState.flags. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "InCombat", value = 0, doc = "The Skyrim player is in combat. ER mirrors it in its own combat state (dodges cost stamina only in combat)." },
  { name = "BridgeOn", value = 1, doc = "The bridge is on (F10). Off = Skyrim plays vanilla; ER leaves its own state alone." },
  { name = "Locomote", value = 2, doc = "ER drives locomotion now (LOCO-PLAN stage B): the move stick is forwarded every frame, turned by cam_yaw, and Dodge for the whole hold (tap = roll, hold = sprint). Off = dodge-only (stick around a dodge)." },
]

[[enums]]
name = "Stance"
repr = "u32"
doc = "InputState.stance: how the Skyrim player holds its weapon; ER switches its own stance (ChrAsm) to match, so the streamed pose matches."
values = [
  { name = "Unarmed", value = 0, doc = "Weapon sheathed, fists, staff or spells: ER fights with fists." },
  { name = "OneHanded", value = 1, doc = "A one-handed weapon drawn." },
  { name = "TwoHanded", value = 2, doc = "A two-handed weapon, bow or crossbow drawn." },
]

[[enums]]
name = "PlayerFlag"
repr = "u32"
doc = "PlayerState.flags. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "InWorld", value = 0, doc = "The ER player is loaded in the world (not title screen / loading)." },
  { name = "IFrame", value = 1, doc = "Invincible (dodge i-frames)." },
  { name = "Dodging", value = 2 },
  { name = "HyperArmor", value = 3 },
  { name = "PoiseBroken", value = 4 },
  { name = "InCombat", value = 5, doc = "ER's own combat state (CSChrDataModule +0x19a bit 0x40 clear): dodges cost stamina." },
  { name = "MoveCancel", value = 6, doc = "ER's TAE movement-cancel window (CANCEL_LS_MOVEMENT): movement may end the current animation." },
  { name = "AttackActive", value = 7, doc = "v9: the swing's hit window is open (CSChrActionFlagModule action_modifiers_flags bit 9 or 10, or +0x1d0 != 0; 2-3 frames mid-sweep, docs/research/elden-ring-combat.md). Skyrim lands the hit once per attack_seq." },
]

[[enums]]
name = "AttackKind"
repr = "u32"
doc = "PlayerState.atk_kind (v9): which motion value ER's numbers used."
values = [
  { name = "None", value = 0 },
  { name = "Light", value = 1, doc = "R1 chain (anim group 300xx)." },
  { name = "Heavy", value = 2, doc = "R2 / charged R2 (305xx)." },
  { name = "Skill", value = 3, doc = "Weapon art (40xxx)." },
  { name = "Other", value = 4, doc = "Running / rolling / jumping / backstep attacks (other 3xxxx)." },
]

[[enums]]
name = "PoseFlag"
repr = "u32"
doc = "PoseState.flags. Values are BIT INDICES: mask = 1 << value."
values = [
  { name = "Active", value = 0, doc = "ER is playing an action Skyrim should show (dodge first). Off = Skyrim plays its own animation (blend out)." },
]

[[enums]]
name = "PoseBone"
repr = "u32"
doc = "Index into PoseState.rot (4 floats each). Parents come before children. Unlisted Skyrim bones ride on their parents."
values = [
  { name = "Pelvis", value = 0, doc = "NPC Pelvis" },
  { name = "Spine", value = 1, doc = "NPC Spine" },
  { name = "Spine1", value = 2, doc = "NPC Spine1" },
  { name = "Spine2", value = 3, doc = "NPC Spine2" },
  { name = "Neck", value = 4, doc = "NPC Neck" },
  { name = "Head", value = 5, doc = "NPC Head" },
  { name = "LClavicle", value = 6, doc = "NPC L Clavicle" },
  { name = "LUpperArm", value = 7, doc = "NPC L UpperArm" },
  { name = "LForearm", value = 8, doc = "NPC L Forearm" },
  { name = "LHand", value = 9, doc = "NPC L Hand" },
  { name = "RClavicle", value = 10, doc = "NPC R Clavicle" },
  { name = "RUpperArm", value = 11, doc = "NPC R UpperArm" },
  { name = "RForearm", value = 12, doc = "NPC R Forearm" },
  { name = "RHand", value = 13, doc = "NPC R Hand" },
  { name = "LThigh", value = 14, doc = "NPC L Thigh" },
  { name = "LCalf", value = 15, doc = "NPC L Calf" },
  { name = "LFoot", value = 16, doc = "NPC L Foot" },
  { name = "RThigh", value = 17, doc = "NPC R Thigh" },
  { name = "RCalf", value = 18, doc = "NPC R Calf" },
  { name = "RFoot", value = 19, doc = "NPC R Foot" },
  { name = "LUpperArmTwist1", value = 20, doc = "NPC L UpperarmTwist1 (ER L_UpArmTwist)" },
  { name = "LUpperArmTwist2", value = 21, doc = "NPC L UpperarmTwist2 (ER L_UpArmTwist1)" },
  { name = "RUpperArmTwist1", value = 22, doc = "NPC R UpperarmTwist1 (ER R_UpArmTwist)" },
  { name = "RUpperArmTwist2", value = 23, doc = "NPC R UpperarmTwist2 (ER R_UpArmTwist1)" },
