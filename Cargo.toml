[workspace]
resolver = "3"
members = ["er-plugin", "protocol", "tools/protogen", "tools/fake-peer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Pinned: this commit's RVA tables support eldenring.exe 2.7.1.0 (WW). Bump only together with the game version pin
# (docs/RECON.md and the $Expected table in tools/setup-check.ps1).
eldenring = { git = "https://github.com/vswarte/eldenring-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
fromsoftware-shared = { git = "https://github.com/vswarte/eldenring-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
# Unwind (not abort): eldenring-rs panics on an unsupported game version, and catching that beats crashing the game.
panic = "unwind"
debug = "line-tables-only"
lto = "thin"
